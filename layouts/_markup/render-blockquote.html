<figure>
  <blockquote {{ with .Attributes.cite }}cite="{{ . }}"{{ end }}>
    {{ .Text }}
  </blockquote>
  {{ with .Attributes.caption }}
    <figcaption>
      {{ if $.Attributes.cite }}
        <a href="{{ . }}">
          {{ markdownify . }}
        </a>
      {{ else }}
        {{ markdownify . }}
      {{ end }}
    </figcaption>
  {{ end }}
</figure>
